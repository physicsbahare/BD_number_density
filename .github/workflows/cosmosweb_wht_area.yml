name: COSMOS-Web DR1 WHT selection-area audit (60mas)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pm_footprint/wht_depth_mask.py'
      - 'tests/test_pm_wht_mask.py'
      - '.github/workflows/cosmosweb_wht_area.yml'

permissions:
  contents: write

concurrency:
  group: cosmosweb-dr1-wht-audit
  cancel-in-progress: false

jobs:
  dr1-wht:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FITS/WCS and exact-geometry dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "astropy>=6" "shapely>=2.1,<3" numpy pandas pytest
      - name: Offline unit tests for official WHT links and fractional gridding
        run: python -m pytest -q tests/test_pm_wht_mask.py tests/test_pm_footprint_exact.py
      - name: Check cached public-MAST metadata and 125 candidates
        run: |
          test -s pm_footprint/results/mast_observations.csv
          test -s pm_footprint/dave125_positions.csv
          test -s pm_footprint/results/exact/summary.json
      - name: Download 20 official 60mas F444W WHT tiles one at a time
        id: compute
        continue-on-error: true
        run: |
          python -m pm_footprint.wht_depth_mask --block 10
      - name: Upload small numerical products and failure/progress metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmosweb-dr1-f444w-wht-audit
          path: pm_footprint/results/wht60/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit WHT summary and candidate membership (not FITS)
        if: steps.compute.outcome == 'success'
        run: |
          test -s pm_footprint/results/wht60/summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pm_footprint/results/wht60/
          if git diff --cached --quiet; then
            echo "No new numerical results"
          else
            git commit -m 'Save provisional COSMOS-Web DR1 F444W WHT intersection and candidate QC'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Surface download or mask computation failure
        if: steps.compute.outcome == 'failure'
        run: |
          echo "WHT computation failed. Review uploaded progress/failure metadata."
          exit 1
