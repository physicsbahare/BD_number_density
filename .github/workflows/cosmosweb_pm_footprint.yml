name: COSMOS-Web multi-epoch PM footprint (metadata only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pm_footprint/**'
      - 'tests/test_pm_footprint.py'
      - '.github/workflows/cosmosweb_pm_footprint.yml'
  schedule:
    # Retry archive computation on the default branch; ChatGPT audits hourly.
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: cosmosweb-pm-footprint
  cancel-in-progress: true

jobs:
  footprint:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Determine whether archival calculation is still pending
        id: state
        shell: bash
        run: |
          code_sha=$(sha256sum pm_footprint/compute.py | cut -d' ' -f1)
          exact_sha=$(sha256sum pm_footprint/exact_geometry.py | cut -d' ' -f1)
          if [ -f pm_footprint/results/mast_observations.csv ]; then
            meta_sha=$(sha256sum pm_footprint/results/mast_observations.csv | cut -d' ' -f1)
          else
            meta_sha=NOT_AVAILABLE
          fi
          if [ -f pm_footprint/results/summary.json ] &&
             [ -f pm_footprint/results/resolution_qc.json ] &&
             [ -f pm_footprint/results/exact/summary.json ] &&
             [ -f pm_footprint/results/exact/neighbour_qc.json ] &&
             grep -q "$exact_sha" pm_footprint/results/exact/summary.json &&
             grep -q "$code_sha" pm_footprint/results/summary.json &&
             grep -q "$code_sha" pm_footprint/results/resolution_qc.json &&
             grep -q "$meta_sha" pm_footprint/results/summary.json; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Matching code and MAST snapshot already audited."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.state.outputs.needed == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Install metadata and MOC dependencies
        if: steps.state.outputs.needed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "astroquery>=0.4.11,<0.5" "mocpy>=0.20,<0.22" "astropy>=6" "shapely>=2,<3" numpy pandas pytest
      - name: Validate epoch and footprint logic on synthetic data
        if: steps.state.outputs.needed == 'true'
        run: python -m pytest -q tests/test_pm_footprint.py tests/test_pm_footprint_exact.py
      - name: Query MAST and compute area + candidate membership
        if: steps.state.outputs.needed == 'true'
        id: calculate
        continue-on-error: true
        run: |
          code_sha=$(sha256sum pm_footprint/compute.py | cut -d' ' -f1)
          if [ -f pm_footprint/results/mast_observations.csv ]; then
            meta_sha=$(sha256sum pm_footprint/results/mast_observations.csv | cut -d' ' -f1)
          else
            meta_sha=NOT_AVAILABLE
          fi
          if [ -f pm_footprint/results/summary.json ] &&
             grep -q "$code_sha" pm_footprint/results/summary.json &&
             grep -q "$meta_sha" pm_footprint/results/summary.json; then
            echo "Current source and metadata snapshot already computed."
          elif [ -f pm_footprint/results/mast_observations.csv ] &&
               head -n 1 pm_footprint/results/mast_observations.csv | grep -q 'dataRights'; then
            python -m pm_footprint.compute --metadata-csv pm_footprint/results/mast_observations.csv
          else
            echo "Refresh MAST snapshot to include public data rights."
            python -m pm_footprint.compute
          fi
      - name: Repeat footprint computation at finer HEALPix order 15
        id: refine
        if: steps.calculate.outcome == 'success' && steps.state.outputs.needed == 'true'
        continue-on-error: true
        run: |
          code_sha=$(sha256sum pm_footprint/compute.py | cut -d' ' -f1)
          if [ ! -f pm_footprint/results/depth15/summary.json ] ||
             ! grep -q "$code_sha" pm_footprint/results/depth15/summary.json; then
            python -m pm_footprint.compute --metadata-csv pm_footprint/results/mast_observations.csv --depth 15 --out pm_footprint/results/depth15
          fi
          python -m pm_footprint.compare_depths
      - name: Independent spherical equal-area polygon audit (30/180/365/730d)
        id: exact
        if: steps.refine.outcome == 'success' && steps.state.outputs.needed == 'true'
        continue-on-error: true
        run: python -m pm_footprint.exact_geometry
      - name: Audit close positional pairs among Dave125 candidates
        id: neighbour
        if: steps.exact.outcome == 'success' && steps.state.outputs.needed == 'true'
        continue-on-error: true
        run: python -m pm_footprint.candidate_neighbour_qc
      - name: Keep reproducibility products from every attempt
        if: always() && steps.state.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cosmosweb-multi-epoch-footprint
          path: pm_footprint/results/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit successful computed data
        if: steps.calculate.outcome == 'success' && steps.refine.outcome == 'success' && steps.exact.outcome == 'success' && steps.neighbour.outcome == 'success'
        run: |
          if [ ! -f pm_footprint/results/summary.json ] || [ ! -f pm_footprint/results/resolution_qc.json ] || [ ! -f pm_footprint/results/exact/summary.json ] || [ ! -f pm_footprint/results/exact/neighbour_qc.json ]; then
            echo "No completed resolution-audited computation found (no area claims permitted)"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pm_footprint/results/
          if git diff --cached --quiet; then
            echo "No changes in footprint output"
          else
            git commit -m 'Save preliminary JWST multi-epoch geometric footprint evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve failure status to enable hourly retries
        if: steps.calculate.outcome == 'failure' || steps.refine.outcome == 'failure' || steps.exact.outcome == 'failure' || steps.neighbour.outcome == 'failure'
        run: |
          echo "MAST/footprint calculation failed. Inspect logs and uploaded artifact; retries continue hourly."
          exit 1
