name: COSMOS-Web filter-resolved red PM opportunities (cached metadata)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pm_footprint/filter_epoch_qc.py'
      - 'tests/test_pm_filter_epoch_qc.py'
      - '.github/workflows/cosmosweb_filter_epoch_qc.yml'

permissions:
  contents: write

concurrency:
  group: cosmosweb-filter-epoch-qc
  cancel-in-progress: false

jobs:
  filter-epoch-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install only cached-metadata geometry dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "shapely>=2.1,<3" numpy pandas pytest
      - name: Run offline public-epoch/filter separation tests
        run: python -m pytest -q tests/test_pm_filter_epoch_qc.py
      - name: Require existing PUBLIC-only MAST snapshot and exact result
        run: |
          test -s pm_footprint/results/mast_observations.csv
          test -s pm_footprint/results/exact/summary.json
          test -s pm_footprint/dave125_positions.csv
      - name: Compute filter-resolved masks only if not already saved
        run: |
          if [ -s pm_footprint/results/filter_epoch_qc/summary.json ]; then
            echo "Cached filter-resolved result already exists. Skipping."
          else
            python -m pm_footprint.filter_epoch_qc
          fi
      - name: Save tiny reproducible filter-specific products
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmosweb-filter-epoch-public-geometry
          path: pm_footprint/results/filter_epoch_qc/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit filter-specific results
        run: |
          test -s pm_footprint/results/filter_epoch_qc/summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pm_footprint/results/filter_epoch_qc/
          if ! git diff --cached --quiet; then
            git commit -m 'Record cached PUBLIC filter-specific red imaging opportunities'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
