name: COSMOS-Web v13 local-footprint algorithm tests (no FITS downloads)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pm_footprint/v13_epoch_overlay.py'
      - 'pm_footprint/local_v13_photometry_probe.py'
      - 'pm_footprint/local_v13_alignment_audit.py'
      - 'pm_footprint/local_v13_catalog_idcheck.py'
      - 'pm_footprint/validate_dave_paper_selection.py'
      - 'pm_footprint/test_validate_dave_paper_selection.py'
      - 'pm_footprint/v13_full_catalog_paper_stages.py'
      - 'pm_footprint/verify_full_catalog_selection.py'
      - 'pm_footprint/test_verify_full_catalog_selection.py'
      - 'pm_footprint/results/v13_full_catalog_paper_stages_20261031.json'
      - 'pm_footprint/test_v13_full_catalog_paper_stages.py'
      - 'pm_footprint/test_local_v13_selection_probes.py'
      - 'pm_footprint/mask_product_integrity.py'
      - 'pm_footprint/test_mask_product_integrity.py'
      - 'pm_footprint/jwst_mask_union_repro.py'
      - 'pm_footprint/jwst_mask_epoch_from_sample.py'
      - 'pm_footprint/coverage_baseline_tradeoff.py'
      - 'pm_footprint/test_coverage_baseline_tradeoff.py'
      - 'pm_footprint/results/coverage_baseline_tradeoff_20261101.json'
      - 'pm_footprint/jwst_mask_wht_sparse_intersection.py'
      - 'pm_footprint/test_jwst_mask_wht_sparse_intersection.py'
      - 'pm_footprint/v13_psf_noise_qc.py'
      - 'pm_footprint/test_v13_psf_noise_qc.py'
      - 'pm_footprint/test_local_v13_photometry_probe.py'
      - 'pm_footprint/v13_starmask_bounds.py'
      - 'pm_footprint/test_v13_starmask_bounds.py'
      - 'pm_footprint/test_v13_epoch_overlay.py'
      - 'pm_footprint/f277w_depth_threshold.py'
      - 'pm_footprint/test_f277w_depth_threshold.py'
      - 'pm_footprint/brightness_stratified_density.py'
      - 'pm_footprint/test_brightness_stratified_density.py'
      - 'pm_footprint/results/magnitude_stratified_density_20261101.json'
      - 'pm_footprint/mask_count_reconciliation.py'
      - 'pm_footprint/test_mask_count_reconciliation.py'
      - 'pm_footprint/results/mask_count_reconciliation_20261101.json'
      - 'pm_footprint/results/f277w_depth_threshold_20261101.json'
      - 'pm_footprint/hybrid_f277w_selection_probability.py'
      - 'pm_footprint/test_hybrid_f277w_selection_probability.py'
      - 'pm_footprint/results/hybrid_f277w_selection_probability_20261101.json'
      - 'pm_footprint/local_v13_wht_sample.py'
      - 'pm_footprint/test_local_v13_wht_sample.py'
      - '.github/workflows/cosmosweb_v13_sample_tests.yml'

permissions:
  contents: read

jobs:
  synthetic-wcs-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight geometry dependencies
        run: python -m pip install 'astropy>=6' 'shapely>=2.1,<3' numpy pandas
      - name: Run offline synthetic FITS and exact-polygon tests
        run: |
          python -m unittest -v pm_footprint.test_local_v13_wht_sample pm_footprint.test_v13_epoch_overlay pm_footprint.test_v13_starmask_bounds pm_footprint.test_local_v13_photometry_probe pm_footprint.test_local_v13_selection_probes pm_footprint.test_jwst_mask_wht_sparse_intersection pm_footprint.test_v13_psf_noise_qc pm_footprint.test_validate_dave_paper_selection pm_footprint.test_v13_full_catalog_paper_stages pm_footprint.test_verify_full_catalog_selection pm_footprint.test_hybrid_f277w_selection_probability pm_footprint.test_f277w_depth_threshold pm_footprint.test_mask_count_reconciliation pm_footprint.test_brightness_stratified_density pm_footprint.test_mask_product_integrity pm_footprint.test_coverage_baseline_tradeoff
      - name: Reproduce provisional conditional v13+JWST star-mask set bounds (offline)
        run: |
          python -m pm_footprint.v13_starmask_bounds --out /tmp/v13_starmask_bounds_qc.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/v13_starmask_bounds_qc.json'))
          lo,hi=d['nominal_mc_mask_fraction_bounds_across_phases']
          assert 0.59<lo<=hi<0.60
          print('Conditional range verified:',lo,hi)
          PY
      - name: Verify independent full-v13 paper counts from user's compact source evidence
        run: |
          python -m pm_footprint.verify_full_catalog_selection \
            --input pm_footprint/results/v13_full_catalog_paper_stages_20261031.json \
            --out /tmp/verified_v13_full_selection.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/verified_v13_full_selection.json'))
          assert d['corrected_error_with_gate_matches_all_125_IDs']
          assert d['numeric_rows_excluded_by_use_phot_gate']==69622
          PY
      - name: Reproduce mask-area insufficiency for all 12 WHT/epoch scenarios
        run: |
          python -m pm_footprint.mask_count_reconciliation --out /tmp/mask_count_reconciliation_qc.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/mask_count_reconciliation_qc.json'))
          scenarios=[v for row in d['wht_threshold_baseline_days'].values() for v in row.values()]
          assert len(scenarios)==12
          assert all(not s['can_star_mask_alone_equalize_densities'] for s in scenarios)
          assert d['wht_threshold_baseline_days']['0']['365']['required_red_only_mask_over_available_upper_bound']>7
          print('All 12 conservative mask-area scenarios cannot equalize densities')
          PY
      - name: Reproduce F444W brightness-stratified source and group counts
        run: |
          python -m pm_footprint.brightness_stratified_density --out /tmp/magnitude_stratified_density_qc.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/magnitude_stratified_density_qc.json'))
          assert d['n_rows']==125 and d['proximity_groups_0p5arcsec']['n_groups']==115
          assert (d['bright_m444_lt25']['red'],d['bright_m444_lt25']['nonred'])==(27,39)
          assert (d['faint_m444_ge25']['red'],d['faint_m444_ge25']['nonred'])==(35,24)
          print('Magnitude stratification and close-pair groups verified')
          PY
      - name: Verify reference metadata exist (no archive or WHT download)
        run: |
          test -s pm_footprint/results/mast_observations.csv
          test -s pm_footprint/results/exact/summary.json
          test -s pm_footprint/dave125_positions.csv
