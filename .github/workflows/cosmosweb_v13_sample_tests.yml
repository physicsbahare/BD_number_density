name: COSMOS-Web v13 local-footprint algorithm tests (no FITS downloads)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pm_footprint/v13_epoch_overlay.py'
      - 'pm_footprint/test_v13_epoch_overlay.py'
      - 'pm_footprint/local_v13_wht_sample.py'
      - 'pm_footprint/test_local_v13_wht_sample.py'
      - '.github/workflows/cosmosweb_v13_sample_tests.yml'

permissions:
  contents: read

jobs:
  synthetic-wcs-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight geometry dependencies
        run: python -m pip install 'astropy>=6' 'shapely>=2.1,<3' numpy pandas
      - name: Run offline synthetic FITS and exact-polygon tests
        run: |
          python -m unittest -v pm_footprint.test_local_v13_wht_sample pm_footprint.test_v13_epoch_overlay
      - name: Verify reference metadata exist (no archive or WHT download)
        run: |
          test -s pm_footprint/results/mast_observations.csv
          test -s pm_footprint/results/exact/summary.json
          test -s pm_footprint/dave125_positions.csv
