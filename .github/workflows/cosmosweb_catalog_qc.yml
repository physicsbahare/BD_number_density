name: COSMOS2025 CDS candidate quality flags (small TAP query)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pm_footprint/catalog_qc_cds.py'
      - 'tests/test_pm_catalog_qc_cds.py'
      - '.github/workflows/cosmosweb_catalog_qc.yml'

permissions:
  contents: write

concurrency:
  group: cosmosweb-cds-candidate-flags
  cancel-in-progress: true

jobs:
  cds-flags:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install small-table dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests pytest
      - name: Run offline candidate join/flag tests
        run: python -m pytest -q tests/test_pm_catalog_qc_cds.py
      - name: Check frozen 125 and successful WHT candidate membership
        run: |
          test -s pm_footprint/dave125_positions.csv
          test -s pm_footprint/results/wht60/dave125_wht_membership.csv
      - name: Query CDS only if no previous result
        id: query
        continue-on-error: true
        run: |
          if [ -s pm_footprint/results/catalog_qc/summary.json ]; then
            echo "Previously saved small CDS candidate QC result exists. Skipping."
          else
            python -m pm_footprint.catalog_qc_cds
          fi
      - name: Upload small diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmosweb-cds-dave125-flags
          path: pm_footprint/results/catalog_qc/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit candidate-only CDS flag summary
        if: steps.query.outcome == 'success'
        run: |
          test -s pm_footprint/results/catalog_qc/summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pm_footprint/results/catalog_qc/
          if ! git diff --cached --quiet; then
            git commit -m 'Save public CDS Dave125 source-level quality-flag audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Surface CDS catalog failure without altering geometry
        if: steps.query.outcome == 'failure'
        run: |
          echo "CDS candidate-only TAP audit failed. Inspect logs/artifact."
          exit 1
