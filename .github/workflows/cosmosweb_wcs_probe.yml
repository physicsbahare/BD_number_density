name: COSMOS-Web DR1 WHT independent i2d WCS probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pm_footprint/probe_i2d_wcs.py'
      - 'pm_footprint/dr1_tile_corners.csv'
      - '.github/workflows/cosmosweb_wcs_probe.yml'

permissions:
  contents: write

concurrency:
  group: cosmosweb-dr1-i2d-header-probe
  cancel-in-progress: true

jobs:
  validate-i2d-wcs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install minimal WCS dependencies
        run: python -m pip install "astropy>=6" "shapely>=2.1,<3" numpy pandas
      - name: Read ONLY first 4MiB of official i2d A1/B10 gzip streams
        id: check
        continue-on-error: true
        run: python -m pm_footprint.probe_i2d_wcs --tiles A1 B10
      - name: Save provenance or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmosweb-wcs-header-probe
          path: pm_footprint/results/*wcs_probe*.json
          if-no-files-found: warn
      - name: Commit successful independent WCS validation
        if: steps.check.outcome == 'success'
        run: |
          test -s pm_footprint/results/wcs_probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pm_footprint/results/wcs_probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save official i2d SCI vs WHT tile-corner astrometry validation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report unresolved original SCI WCS check
        if: steps.check.outcome == 'failure'
        run: exit 1
